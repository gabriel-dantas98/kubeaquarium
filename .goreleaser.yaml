version: 2

project_name: kubeaquarium

before:
  hooks:
    - go mod tidy

builds:
  - id: kubeaquarium
    main: ./cmd/kubeaquarium
    binary: kubeaquarium
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/gabriel-dantas98/kubeaquarium/internal/cli.Version={{.Version}}
      - -X github.com/gabriel-dantas98/kubeaquarium/internal/cli.Commit={{.ShortCommit}}
      - -X github.com/gabriel-dantas98/kubeaquarium/internal/cli.Date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"

release:
  draft: false
  prerelease: auto
  header: |
    ## kubeaquarium {{ .Tag }}
    A live 3D aquarium for your Kubernetes cluster.

    Install:
    ```
    curl -sSfL https://raw.githubusercontent.com/gabriel-dantas98/kubeaquarium/main/scripts/install.sh | sh
    ```

