name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/configure-pages@v5

      - name: build demo
        working-directory: web
        run: |
          npm ci
          npm run build:demo

      - name: add landing page under site/home
        run: |
          set -euo pipefail
          home=site/home
          mkdir -p "$home"
          cp docs/index.html docs/.nojekyll "$home"/
          cp -R docs/assets "$home"/assets
          # copy only the screenshots referenced by the landing page, keeping relative paths
          grep -oE 'screenshots/[^"]+' docs/index.html | sort -u | while read -r img; do
            mkdir -p "$home/$(dirname "$img")"
            cp "docs/$img" "$home/$img"
          done
          find "$home" -type f | sort

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
